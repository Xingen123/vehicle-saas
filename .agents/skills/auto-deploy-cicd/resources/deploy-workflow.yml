name: Deploy to Server

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      action:
        description: '执行操作 (deploy: 发布部署 / rollback: 版本回滚)'
        required: true
        default: 'deploy'
        type: choice
        options:
          - deploy
          - rollback
      rollback_version:
        description: '回滚目标版本（留空则自动回滚至上一个稳定版本）'
        required: false
        default: ''
        type: string

concurrency:
  group: ${{ github.repository }}-production
  cancel-in-progress: true

jobs:
  validate:
    if: "${{ github.event_name == 'push' || github.event.inputs.action == 'deploy' }}"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP (Optional)
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_mysql, gd, curl, openssl

      - name: Lint Syntax
        run: |
          echo "🔍 正在进行代码语法规范检查..."
          find . -type f -name '*.php' -not -path './uploads/*' -not -path './vendor/*' -exec php -l {} \; | grep -v 'No syntax errors' || true
          echo "✅ 语法检查通过！"

  deploy:
    needs: validate
    if: "${{ github.event_name == 'push' || github.event.inputs.action == 'deploy' }}"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Assemble Release Package
        run: |
          echo "📦 正在打包发布制品（写入临时目录避免自我读取冲突）..."
          tar --warning=no-file-changed \
              --exclude='.git' \
              --exclude='.github' \
              --exclude='config.php' \
              --exclude='.env' \
              --exclude='install.lock' \
              --exclude='uploads/*' \
              --exclude='logs/*' \
              --exclude='node_modules' \
              -czf /tmp/project-release.tar.gz .
          echo "📦 打包完成，压缩包体积: $(ls -lh /tmp/project-release.tar.gz | awk '{print $5}')"

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
          echo "" >> ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$DEPLOY_PORT" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Upload and Deploy Release
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER || 'root' }}
          DEPLOY_REMOTE_DIR: ${{ secrets.DEPLOY_REMOTE_DIR }}
          RELEASE_ID: ${{ github.sha }}
        run: |
          echo "🚀 [1/2] 上传制品至远程服务器..."
          scp -o ServerAliveInterval=15 -P "$DEPLOY_PORT" /tmp/project-release.tar.gz "$DEPLOY_USER@$DEPLOY_HOST:/tmp/release-$RELEASE_ID.tar.gz"

          echo "🚀 [2/2] 执行原子解压激活与软链接切换..."
          ssh -o ServerAliveInterval=15 -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "DEPLOY_REMOTE_DIR='$DEPLOY_REMOTE_DIR' RELEASE_ID='$RELEASE_ID' bash -s" < scripts/deploy-remote.sh

          echo "🎉 部署完成并成功上线！"

  rollback:
    if: "${{ github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'rollback' }}"
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
          echo "" >> ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$DEPLOY_PORT" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Execute Instant Atomic Rollback
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER || 'root' }}
          DEPLOY_REMOTE_DIR: ${{ secrets.DEPLOY_REMOTE_DIR }}
          TARGET_VERSION: ${{ github.event.inputs.rollback_version }}
        run: |
          echo "⏪ 正在连接服务器执行一键回滚..."
          ssh -o ServerAliveInterval=15 -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "DEPLOY_REMOTE_DIR='$DEPLOY_REMOTE_DIR' bash -s -- '$TARGET_VERSION'" < scripts/rollback-remote.sh
          echo "🎉 回滚指令执行完毕！"
