# ========================================================
# Nginx 生产环境安全加固规则 (Security Hardening Rules)
# 适用于宝塔面板 extension/*.conf 或原生 Nginx server 块
# ========================================================

# 1. 禁止访问数据库备份、源码脚本及配置文件
location ~* \.(sql|bak|inc|old|log|env|yml|yaml|ini)$ {
    return 404;
}
location ~* /(config\.php|install\.lock|\.git|\.user\.ini|\.htaccess) {
    return 404;
}

# 2. 禁止外部直接访问内部模块代码与内部日志目录
location ~* ^/(includes|cron|logs|storage/logs)/ {
    return 404;
}

# 3. 生产环境禁用安装向导
location ~* ^/install\.php {
    return 404;
}

# 4. 上传静态媒体目录禁止解析任何可执行脚本（防范 WebShell 提权）
location ~* ^/uploads/.*\.(php|phtml|phar|sh|pl|py|cgi|asp|aspx|jsp)$ {
    deny all;
}
