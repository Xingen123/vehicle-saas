name: Deploy to Server

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: vehicle-saas-production
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_mysql, gd, curl, openssl, fileinfo

      - name: Lint PHP Syntax
        run: |
          echo "🔍 正在进行 PHP 语法规范检查..."
          find . -type f -name '*.php' -not -path './uploads/*' -exec php -l {} \; | grep -v 'No syntax errors' || true
          echo "✅ 语法检查通过！"

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Assemble Release Package
        run: |
          echo "📦 正在打包发布制品..."
          # 排除 Git元数据、工作流配置、敏感文件、动态照片及运行日志
          tar --exclude='.git' \
              --exclude='.github' \
              --exclude='config.php' \
              --exclude='install.lock' \
              --exclude='uploads/*' \
              --exclude='logs/*' \
              --exclude='assets/images/Tahoe-wallpaper.png' \
              -czf vehicle-saas-release.tar.gz .
          echo "📦 打包完成，压缩包体积: $(ls -lh vehicle-saas-release.tar.gz | awk '{print $5}')"

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$DEPLOY_PORT" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Upload and Deploy Release
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER || 'root' }}
          DEPLOY_REMOTE_DIR: ${{ secrets.DEPLOY_REMOTE_DIR || '/www/wwwroot/vehicle-saas' }}
          RELEASE_ID: ${{ github.sha }}
        run: |
          echo "🚀 [1/2] 上传制品至远程服务器..."
          scp -o ServerAliveInterval=15 -P "$DEPLOY_PORT" vehicle-saas-release.tar.gz "$DEPLOY_USER@$DEPLOY_HOST:/tmp/vehicle-saas-release-$RELEASE_ID.tar.gz"

          echo "🚀 [2/2] 执行远程解压激活与权限配置..."
          ssh -o ServerAliveInterval=15 -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "DEPLOY_REMOTE_DIR='$DEPLOY_REMOTE_DIR' RELEASE_ID='$RELEASE_ID' bash -s" < scripts/deploy-remote.sh

          echo "🎉 部署完成并成功上线！"
